<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Supreme 26S/S Pick Board</title>
<style>
:root{
  --bg:#0b0b0c; --panel:#141416; --panel2:#1b1b1f; --line:#2a2a30;
  --txt:#f3f3f4; --mut:#8a8a93; --acc:#e51937; --acc2:#ff3b54;
  --ok:#33d17a; --chip:#222228; --kream:#161616; --kream-line:#333;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:"Helvetica Neue",Helvetica,Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased; font-size:14px;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}

/* ===== Header ===== */
header{
  position:sticky; top:0; z-index:50; background:rgba(11,11,12,.92);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
}
.bar{display:flex;align-items:center;gap:14px;padding:12px 18px;flex-wrap:wrap}
.logo{font-weight:800;font-style:italic;font-size:20px;letter-spacing:-.5px}
.logo b{background:var(--acc);color:#fff;padding:2px 8px;border-radius:3px;font-style:italic}
.meta-line{color:var(--mut);font-size:12px}
.spacer{flex:1}
.io-btns{display:flex;gap:8px}
.io-btns button{
  background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  padding:7px 12px;border-radius:8px;font-size:12px
}
.io-btns button:hover{border-color:var(--acc)}

/* ===== Filters ===== */
.filters{display:flex;gap:8px;padding:10px 18px;flex-wrap:wrap;border-bottom:1px solid var(--line);align-items:center}
.chip{
  background:var(--chip);border:1px solid var(--line);color:var(--txt);
  padding:6px 13px;border-radius:999px;font-size:12.5px;white-space:nowrap
}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.chip.week{border-color:var(--acc2)}
.chip.week.on{background:var(--acc2);border-color:var(--acc2)}
.toggle{
  display:inline-flex;align-items:center;gap:7px;margin-left:auto;
  color:var(--mut);font-size:12.5px;user-select:none
}
.toggle input{accent-color:var(--acc);width:15px;height:15px}
.sortsel{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:8px;padding:6px 10px;font-size:12px;margin-left:8px}
.sortsel:hover{border-color:var(--acc)}

/* ===== Layout ===== */
#galleryView{padding:16px 18px 60px}
#picksView{padding:16px 18px 80px;max-width:1100px;margin:0 auto}
.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:45;
  background:rgba(11,11,12,.95);backdrop-filter:blur(8px)}
.tabs button{flex:1;max-width:200px;background:none;border:none;color:var(--mut);padding:13px;
  font-size:13.5px;font-weight:700;border-bottom:2px solid transparent}
.tabs button.on{color:var(--txt);border-bottom-color:var(--acc)}

/* ===== Grid & Sections ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.wsec{margin-bottom:30px;scroll-margin-top:170px}
.wsec-head{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;
  padding:10px 0 8px;border-bottom:1px solid var(--line);
  position:sticky;top:var(--hdr,154px);z-index:30;
  background:var(--bg)}
.wsec-head h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.3px}
.wsec-head span{color:var(--mut);font-size:12px}
.weekjump{display:flex;gap:6px;padding:9px 18px;flex-wrap:wrap;align-items:center;
  border-bottom:1px solid var(--line);background:var(--panel)}
.weekjump .jl{color:var(--mut);font-size:11.5px;margin-right:2px}
.wchip{background:var(--chip);border:1px solid var(--line);color:var(--mut);
  padding:4px 9px;border-radius:6px;font-size:11px;white-space:nowrap}
.wchip:hover{border-color:var(--acc);color:var(--txt)}
.wchip:focus{outline:none}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;display:flex;flex-direction:column;position:relative;
  transition:border-color .15s,transform .15s;
  content-visibility:auto;contain-intrinsic-size:240px
}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
.card.picked{border-color:var(--ok)}
.thumb{aspect-ratio:1/1;background:#fff;position:relative;cursor:pointer;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;
  position:absolute;inset:0;opacity:0;transition:opacity .25s}
.thumb img.on{opacity:1}
.dots{position:absolute;bottom:7px;left:0;right:0;display:flex;justify-content:center;gap:4px;
  pointer-events:none;opacity:0;transition:opacity .2s;z-index:2}
.card:hover .dots{opacity:1}
.dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.45);
  box-shadow:0 0 2px rgba(0,0,0,.6)}
.dots i.on{background:#fff}
.price{font-size:12px;font-weight:700;color:var(--ok)}
.price.tba{color:var(--mut);font-weight:500}
.badge{
  position:absolute;top:7px;left:7px;font-size:10px;font-weight:800;
  padding:3px 7px;border-radius:5px;letter-spacing:.3px
}
.badge.coming{background:#000;color:#fff;border:1px solid #444}
.badge.wk{background:var(--acc2);color:#fff}
.badge.wk.hot{background:var(--acc)}
.add{
  position:absolute;bottom:7px;right:7px;width:30px;height:30px;border-radius:50%;
  background:rgba(0,0,0,.78);color:#fff;border:1px solid #555;font-size:19px;
  display:flex;align-items:center;justify-content:center;line-height:1
}
.add:hover{background:var(--acc);border-color:var(--acc)}
.card.picked .add{background:var(--ok);border-color:var(--ok);color:#000}
.cbody{padding:9px 10px 10px;display:flex;flex-direction:column;gap:7px;flex:1}
.cname{font-size:12.5px;line-height:1.35;font-weight:600;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.ccat{color:var(--mut);font-size:11px}
.kream-btn{
  margin-top:auto;display:block;text-align:center;background:var(--kream);
  border:1px solid var(--kream-line);color:#fff;border-radius:8px;
  padding:8px 6px;font-size:12px;font-weight:700;letter-spacing:.2px
}
.kream-btn:hover{border-color:#888;background:#1f1f1f}

/* ===== Aside / Picks ===== */
/* --- new picks view --- */
.pk-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.pk-add{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 16px;font-size:13px;font-weight:700}
.pk-add:hover{border-color:var(--acc)}
.pk-add i{font-style:normal;color:var(--acc);margin-right:4px}
.pk-grand{font-size:14px;color:var(--mut)}
.pk-grand b{color:var(--ok)}
.baskets{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:26px}
.basket{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.basket-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.basket-move{display:flex;gap:2px;flex:none}
.basket-move .bmv{width:22px;height:24px;background:var(--chip);border:1px solid var(--line);color:var(--txt);border-radius:5px;font-size:14px;line-height:1;padding:0}
.basket-move .bmv:hover:not(:disabled){border-color:var(--acc2)}
.basket-move .bmv:disabled{opacity:.3;cursor:default}
.bl-price{display:flex;align-items:center;gap:2px;flex:none}
.bl-price .cur{font-size:12px;color:var(--mut)}
.bl-fields{display:flex;align-items:center;gap:5px;margin-top:4px;flex-wrap:wrap}
.bl-dot{width:11px;height:11px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.25)}
.bl-color{width:62px}.bl-size{width:50px}
.bl-color,.bl-size{background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:4px 6px;font-size:11px}
.bl-color:focus,.bl-size:focus{outline:none;border-color:var(--acc2)}
.bl-pricewrap{display:inline-flex;align-items:center;gap:2px}
.bl-pricewrap .cur{font-size:12px;color:var(--mut)}
.bl-priceinput{width:54px;background:var(--bg);border:1px solid var(--line);color:var(--ok);
  border-radius:6px;padding:4px 6px;font-size:11px;font-weight:700;text-align:right}
.bl-priceinput::placeholder{color:var(--mut);font-weight:400}
.bl-priceinput:focus{outline:none;border-color:var(--acc2)}
.basket-grip{color:var(--mut);font-size:13px;cursor:grab;flex:none;letter-spacing:-1px}
.basket-head[draggable="true"]{cursor:grab}
.basket.bdragging{opacity:.45}
.basket.btarget{outline:2px dashed var(--acc);outline-offset:2px}
.basket-name{flex:1;min-width:0;background:transparent;border:none;color:var(--txt);font-size:14px;font-weight:700;padding:4px 2px;border-radius:6px}
.basket-name:hover,.basket-name:focus{background:var(--panel2);outline:none}
.basket-sum{text-align:right;flex:none}
.bs-price{font-size:17px;font-weight:800;color:var(--ok)}
.bs-cnt{font-size:11px;color:var(--mut)}
.basket-del{background:none;border:none;color:var(--mut);font-size:14px;flex:none;padding:2px 4px}
.basket-del:hover{color:var(--acc)}
.basket-body{min-height:48px}
.basket-body.over{outline:2px dashed var(--acc2);outline-offset:2px;border-radius:8px}
.drop-empty{border:1px dashed var(--line);border-radius:8px;padding:16px;text-align:center;color:var(--mut);font-size:12px}
.bline{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line)}
.bline:first-child{border-top:none}
.bline img{width:40px;height:40px;object-fit:cover;border-radius:6px;background:#fff;flex:none}
.bl-main{flex:1;min-width:0}
.bl-name{font-size:12.5px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl-sub{font-size:11px;color:var(--mut);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bl-sub .lt{display:inline-flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--txt)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.bl-del{background:none;border:none;color:var(--mut);font-size:17px;flex:none;padding:0 2px}
.bl-del:hover{color:var(--acc)}
.pool{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px}
.pool-head{font-size:12.5px;color:var(--mut);margin-bottom:11px}
.pool-list{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px;cursor:grab}
.pitem .grip{color:var(--mut);font-size:13px;flex:none;letter-spacing:-2px}
.pitem img{width:40px;height:40px;object-fit:cover;border-radius:6px;background:#fff;flex:none}
.pi-main{flex:1;min-width:0}
.pi-name{font-size:12.5px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi-sub{font-size:11px;color:var(--mut);margin-top:2px}
.pi-color,.pi-size{background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:6px;font-size:11.5px;flex:none}
.pi-color{width:72px}.pi-size{width:58px}
.pi-color:focus,.pi-size:focus{outline:none;border-color:var(--acc2)}
.pi-to{background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:6px;font-size:11.5px;flex:none;max-width:96px}
.pi-add{background:var(--acc);border:1px solid var(--acc);color:#fff;border-radius:7px;padding:6px 12px;font-size:11.5px;font-weight:700;flex:none}
.pi-add:hover{background:var(--acc2);border-color:var(--acc2)}
.pi-remove{background:none;border:none;color:var(--mut);font-size:16px;flex:none;padding:0 2px}
.pi-remove:hover{color:var(--acc)}
@media(max-width:600px){
  .pitem{flex-wrap:wrap}
  .pi-main{flex:1 1 100%;order:-1}
}

.aside h2{font-size:13px;margin:0 0 4px;letter-spacing:.4px;color:var(--mut);text-transform:uppercase}
.sec{margin-bottom:22px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.sec-head .sub{color:var(--mut);font-size:11.5px}
.empty{color:var(--mut);font-size:12px;padding:10px 2px;border:1px dashed var(--line);border-radius:8px;text-align:center}
.pick{
  display:flex;flex-direction:column;gap:7px;background:var(--panel2);
  border:1px solid var(--line);border-radius:9px;padding:7px;margin-bottom:7px;cursor:grab
}
.pick.drag{opacity:.4}
.pick-row{display:flex;gap:9px;align-items:center}
.pick img{width:42px;height:42px;object-fit:cover;border-radius:6px;background:#fff;flex:none}
.pick .pn{flex:1;min-width:0;font-size:12px;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pick .pchk{accent-color:var(--acc);width:15px;height:15px;flex:none}
.pick .del{background:none;border:none;color:var(--mut);font-size:18px;flex:none;padding:0 2px}
.pick .del:hover{color:var(--acc)}
.pnote{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);
  border-radius:7px;padding:6px 8px;font-size:11.5px;font-family:inherit}
.pnote::placeholder{color:var(--mut)}
.pnote:focus{outline:none;border-color:var(--acc2);cursor:text}
.bulk{display:flex;gap:8px;margin-bottom:10px}
.bulk button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:8px;padding:7px;font-size:11.5px}
.bulk button:hover{border-color:var(--acc)}
.bulk #delSel{border-color:#5a2730;color:#ff8a9a}
.bulk #delSel:hover{border-color:var(--acc);background:#2a1418}
.movebar{margin-bottom:12px}
.movebar .mlabel{display:block;color:var(--mut);font-size:11px;margin-bottom:5px}
.movebar .mbtns{display:flex;gap:6px}
.movebar .mbtns button{flex:1;background:var(--panel2);border:1px solid var(--line);
  color:var(--txt);border-radius:8px;padding:7px 4px;font-size:11px;white-space:nowrap}
.movebar .mbtns button:hover{border-color:var(--acc2)}
.total{border-top:1px solid var(--line);padding-top:10px;margin-top:6px;
  display:flex;justify-content:space-between;font-size:13px}
.total b{color:var(--ok)}

/* ===== Mobile ===== */
@media(max-width:820px){
  .cards{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:11px}
  .weekjump{padding:8px 12px}
  #picksView{padding:12px 12px 80px}
  .baskets{grid-template-columns:1fr !important}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo"><b>Supreme</b> <span id="logoSeason">Pick Board</span></div>
    <div class="meta-line" id="metaLine"></div>
    <div class="spacer"></div>
    <div class="io-btns">
      <button id="btnExport">내보내기</button>
      <button id="btnImport">가져오기</button>
      <input type="file" id="fileImport" accept="application/json" hidden>
    </div>
  </div>
  <div class="filters" id="filters"></div>
  <div class="weekjump" id="weekJump" style="display:none"></div>
</header>

<div class="tabs">
  <button id="tabGallery" class="on">갤러리</button>
  <button id="tabPicks">내 픽 <span id="tabCount"></span></button>
</div>

<main id="galleryView"><div id="grid"></div></main>

<section id="picksView" hidden>
  <div id="picksWrap"></div>
</section>

<script type="module">
const DATA = await (async()=>{ const r=await fetch("data/data.json",{cache:"no-store"}); if(!r.ok) throw new Error("data load failed"); return await r.json(); })();

/* ---------- KREAM 검색어: Supreme 접두어 + 시즌 태그(26ss/26fw 자동) 둘 다 유지 ---------- */
/* 이미지 리사이즈: supremedroplist CDN은 ?width=N 지원 (원본 수MB → 수KB) */
function thumb(url, w){
  if(!url) return url;
  if(url.indexOf("supremedroplist.com")<0) return url;
  if(url.indexOf("?")>=0) return url;
  return url + "?width=" + (w||400);
}

function kreamUrl(name){
  let s=(name||"").replace(/[®™]/g,"").replace(/\s*\/\s*/g," ");
  s=s.replace(/\bZip Up\b/ig,"").replace(/\bS S\b/g,"").replace(/\bL S\b/g,"");
  s=s.replace(/\s+/g," ").trim();
  if(!/^supreme\b/i.test(s)) s="Supreme "+s;
  s=s+" "+(DATA.kreamTag||"26ss");
  return "https://kream.co.kr/search?tab=products&keyword="+encodeURIComponent(s);
}

const LATEST = DATA.latestWeek;
const STORE_KEY = "supreme26ss_picks_v1";
const NOTES_KEY = "supreme26ss_notes_v1";
const BASKET_KEY = "supreme26ss_baskets_v1";

let state = {
  cat: "ALL",
  unreleasedOnly: false,
  view: "gallery",        // "gallery" | "picks"
  picks: loadPicks(),     // array of item ids, in order (찜)
  notes: loadNotes(),     // { id: "메모" }
  baskets: loadBaskets(), // [{id,name,lines:[{lid,itemId,color,size,price}]}]
  selected: new Set(),    // ids checked for bulk delete
};

function loadPicks(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch(e){ return []; }
}
function savePicks(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state.picks)); }catch(e){}
}
function loadNotes(){
  try{ return JSON.parse(localStorage.getItem(NOTES_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveNotes(){
  try{ localStorage.setItem(NOTES_KEY, JSON.stringify(state.notes)); }catch(e){}
}
function loadBaskets(){
  try{
    const b = JSON.parse(localStorage.getItem(BASKET_KEY));
    if(Array.isArray(b) && b.length) return b;
  }catch(e){}
  return [{id:"b1", name:"1번 박스", lines:[]}];
}
function saveBaskets(){
  try{ localStorage.setItem(BASKET_KEY, JSON.stringify(state.baskets)); }catch(e){}
}
let _uid = Date.now();
function uid(p){ return (p||"x")+(_uid++).toString(36); }

const byId = {};
DATA.items.forEach(it=>byId[it.id]=it);

/* ---------- Filters ---------- */
function buildFilters(){
  const f = document.getElementById("filters");
  const cats = ["ALL", ...DATA.cats];
  let html = "";
  cats.forEach(c=>{
    html += `<button class="chip ${state.cat===c?'on':''}" data-cat="${c}">${c==='ALL'?'전체':c}</button>`;
  });
  html += `<label class="toggle"><input type="checkbox" id="relToggle" ${state.unreleasedOnly?'checked':''}> 미발매만 보기</label>`;
  f.innerHTML = html;

  f.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;render();});
  document.getElementById("relToggle").onchange=e=>{state.unreleasedOnly=e.target.checked;render();};

  // 주차 바로가기 칩 (전체 보기일 때만)
  const jump = document.getElementById("weekJump");
  if(!state.unreleasedOnly){
    const weeks = [...new Set(DATA.items.filter(x=>x.released).map(x=>x.week))].sort((a,b)=>b-a);
    jump.style.display = "flex";
    jump.innerHTML = `<span class="jl">바로가기:</span>`
      + `<button class="wchip" data-jump="unreleased">미발매 ${DATA.counts.unreleased}</button>`
      + weeks.map(w=>{
          const n = DATA.items.filter(x=>x.released&&x.week===w).length;
          return `<button class="wchip" data-jump="w${w}">W${w} ${n}</button>`;
        }).join("");
    jump.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{
      const el=document.getElementById("sec-"+b.dataset.jump);
      if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
    });
  }else{
    jump.style.display = "none";
    jump.innerHTML = "";
  }
}

/* ---------- Gallery ---------- */
function priceNum(p){ const m=(p||"").match(/\d+/); return m?parseInt(m[0],10):null; }

function filteredItems(){
  let list = DATA.items.slice();
  if(state.cat!=="ALL") list = list.filter(x=>x.cat===state.cat);
  if(state.unreleasedOnly) list = list.filter(x=>!x.released);
  return list;
}

function cardHtml(it, pset){
  const picked = pset.has(it.id);
  const badge = it.released ? `` : `<span class="badge coming">예정</span>`;
  const imgs = (it.imgs && it.imgs.length ? it.imgs : [it.img]).slice(0,6).map(u=>thumb(u,400));
  // 첫 장만 즉시(단, lazy), 나머지는 data 속성에 보관 → 호버 때 생성
  const rest = imgs.slice(1);
  const restAttr = rest.length ? ` data-rest="${esc(rest.join('|'))}"` : "";
  const priceHtml = it.price ? `<span class="price">${it.price}</span>` : `<span class="price tba">가격 미정</span>`;
  return `<div class="card ${picked?'picked':''}" data-id="${it.id}">
      <div class="thumb" data-url="${it.url}" data-imgs="${imgs.length}"${restAttr}>
        ${badge}
        <img class="on" loading="lazy" decoding="async" src="${imgs[0]}" alt="${esc(it.name)}">
        <button class="add" data-add="${it.id}" title="픽 추가/제거">${picked?'✓':'+'}</button>
      </div>
      <div class="cbody">
        <div class="cname">${esc(it.name)}</div>
        <div class="ccat">${it.cat} · ${priceHtml}</div>
        <a class="kream-btn" href="${kreamUrl(it.name)}" target="_blank" rel="noopener">KREAM 검색</a>
      </div>
    </div>`;
}

function renderGallery(){
  const grid = document.getElementById("grid");
  const list = filteredItems();
  const pset = new Set(state.picks);

  if(!list.length){ grid.innerHTML = `<div class="empty">조건에 맞는 아이템이 없습니다.</div>`; bindGalleryEvents(); return; }

  let html = "";
  if(state.unreleasedOnly){
    // 미발매만: 단일 섹션
    html = secBlock("unreleased", `Left To Drop · 미발매`, list.length, list, pset);
  }else{
    // 전체: 섹션 분할 (미발매 → 주차 내림차순)
    const un = list.filter(x=>!x.released);
    if(un.length){
      html += secBlock("unreleased", `Left To Drop · 미발매`, un.length, un, pset);
    }
    const weeks = [...new Set(list.filter(x=>x.released).map(x=>x.week))].sort((a,b)=>b-a);
    weeks.forEach(w=>{
      const wi = list.filter(x=>x.released && x.week===w);
      const label = `Week ${w}` + (w===LATEST?` · 최신`:``);
      html += secBlock("w"+w, label, wi.length, wi, pset);
    });
  }
  grid.innerHTML = html;
  bindGalleryEvents();
}

const CAT_RANK = {};
DATA.cats.forEach((c,i)=>CAT_RANK[c]=i);

function secBlock(id, title, count, items, pset){
  const sorted = items.slice().sort((a,b)=>{
    const ra=(CAT_RANK[a.cat]??99), rb=(CAT_RANK[b.cat]??99);
    if(ra!==rb) return ra-rb;
    return (a.name||"").localeCompare(b.name||"");
  });
  return `<section class="wsec" id="sec-${id}">
    <div class="wsec-head"><h3>${title}</h3><span>${count}개</span></div>
    <div class="cards">${sorted.map(it=>cardHtml(it,pset)).join("")}</div>
  </section>`;
}

function buildRestImages(thumb){
  if(thumb.dataset.built) return;        // 이미 생성됨
  thumb.dataset.built = "1";
  const rest = thumb.dataset.rest;
  if(!rest) return;
  const urls = rest.split("|");
  const first = thumb.querySelector("img");
  const frag = document.createDocumentFragment();
  urls.forEach(u=>{
    const im = document.createElement("img");
    im.loading = "lazy"; im.decoding = "async"; im.src = u; im.alt = "";
    frag.appendChild(im);
  });
  // 이미지들은 첫 img 뒤에 삽입
  first.after(frag);
  // dots 생성
  const total = urls.length + 1;
  const dots = document.createElement("div");
  dots.className = "dots";
  for(let i=0;i<total;i++){ const d=document.createElement("i"); if(i===0)d.classList.add("on"); dots.appendChild(d); }
  thumb.appendChild(dots);
}

function startSlide(card){
  const t = card.querySelector(".thumb");
  if(+t.dataset.imgs <= 1) return;
  buildRestImages(t);
  const imgs=[...t.querySelectorAll("img")];
  const dots=[...t.querySelectorAll(".dots i")];
  let idx=0;
  const show=i=>{
    imgs[idx].classList.remove("on"); if(dots[idx])dots[idx].classList.remove("on");
    idx=(i+imgs.length)%imgs.length;
    imgs[idx].classList.add("on"); if(dots[idx])dots[idx].classList.add("on");
  };
  const timer=setInterval(()=>show(idx+1),650);
  card._slideStop=()=>{ clearInterval(timer); show(0); card._slideStop=null; };
  t.onmousemove=e=>{
    const r=t.getBoundingClientRect();
    const seg=Math.floor((e.clientX-r.left)/(r.width/imgs.length));
    if(seg!==idx && seg>=0 && seg<imgs.length) show(seg);
  };
}

function bindGalleryEvents(){
  const grid = document.getElementById("grid");
  // 이벤트 위임: 클릭/추가
  grid.onclick = e=>{
    const add = e.target.closest("[data-add]");
    if(add){ e.stopPropagation(); togglePick(add.dataset.add); return; }
    const thumb = e.target.closest(".thumb");
    if(thumb && !e.target.closest(".add")){ window.open(thumb.dataset.url,"_blank"); }
  };
  // 호버 위임 (mouseover/out은 버블링됨)
  grid.onmouseover = e=>{
    const card = e.target.closest(".card");
    if(card && !card._slideStop && !card.contains(e.relatedTarget)) startSlide(card);
  };
  grid.onmouseout = e=>{
    const card = e.target.closest(".card");
    if(card && card._slideStop && !card.contains(e.relatedTarget)) card._slideStop();
  };
}

function togglePick(id){
  const i = state.picks.indexOf(id);
  if(i>=0) state.picks.splice(i,1);
  else state.picks.push(id);
  savePicks(); patchPickState();  // 갤러리 전체 재렌더 없이 카드만 업데이트
}

/* ---------- Picks view (찜 목록 + 여러 바구니) ---------- */
function priceOf(itemId, line){
  // 직접 입력(line.price) 우선, 없으면 사이트 가격
  if(line && line.price!=null && line.price!=="") return Number(line.price)||0;
  const it=byId[itemId];
  return it ? (priceNum(it.price)||0) : 0;
}

function basketTotal(b){
  return b.lines.reduce((s,l)=>s+priceOf(l.itemId,l),0);
}

function updateTotals(){
  // 각 바구니/전체 합계 텍스트만 갱신 (입력 포커스 유지)
  let grand=0;
  state.baskets.forEach(b=>{
    const tot=basketTotal(b); grand+=tot;
    const el=document.querySelector(`.basket[data-bid="${b.id}"] .bs-price`);
    if(el) el.textContent="$"+tot;
  });
  const g=document.querySelector(".pk-grand");
  if(g){
    const cnt=state.baskets.reduce((s,b)=>s+b.lines.length,0);
    g.innerHTML=`전체 <b>${cnt}개</b> · <b>$${grand}</b>`;
  }
}

  html += `<div class="baskets">`;

function bindPicksView(){
  // 바구니 추가
  const add=document.getElementById("addBasket");
  if(add) add.onclick=()=>{
    const n=state.baskets.length+1;
    state.baskets.push({id:uid("b"), name:n+"번 박스", lines:[]});
    saveBaskets();renderPicks();
  };
  // 바구니 이름
  document.querySelectorAll("[data-bname]").forEach(inp=>inp.oninput=()=>{
    const b=state.baskets.find(x=>x.id===inp.dataset.bname);
    if(b){ b.name=inp.value; saveBaskets(); }
  });
  // 바구니 삭제
  document.querySelectorAll("[data-bdel]").forEach(btn=>btn.onclick=()=>{
    if(state.baskets.length<=1){ alert("바구니는 최소 1개는 있어야 합니다."); return; }
    if(!confirm("이 바구니를 삭제할까요? (담긴 항목도 사라집니다)")) return;
    state.baskets=state.baskets.filter(x=>x.id!==btn.dataset.bdel);
    saveBaskets();renderPicks();
  });
  // 바구니 좌우 이동
  document.querySelectorAll("[data-bmove]").forEach(btn=>btn.onclick=()=>{
    const [bid,dir]=btn.dataset.bmove.split("|");
    const i=state.baskets.findIndex(x=>x.id===bid);
    const j=dir==="left"?i-1:i+1;
    if(j<0||j>=state.baskets.length) return;
    [state.baskets[i],state.baskets[j]]=[state.baskets[j],state.baskets[i]];
    saveBaskets();renderPicks();
  });
  // 라인 삭제
  document.querySelectorAll("[data-ldel]").forEach(btn=>btn.onclick=()=>{
    const [bid,lid]=btn.dataset.ldel.split("|");
    const b=state.baskets.find(x=>x.id===bid);
    if(b){ b.lines=b.lines.filter(l=>l.lid!==lid); saveBaskets();renderPicks(); }
  });
  // 라인 가격 직접 입력 (입력 중엔 합계만 갱신, 포커스 유지)
  document.querySelectorAll("[data-lprice]").forEach(inp=>{
    inp.onmousedown=e=>e.stopPropagation();
    inp.oninput=()=>{
      const [bid,lid]=inp.dataset.lprice.split("|");
      const b=state.baskets.find(x=>x.id===bid);
      if(!b) return;
      const l=b.lines.find(x=>x.lid===lid);
      if(!l) return;
      const v=inp.value.replace(/[^\d.]/g,"");
      l.price = v;
      saveBaskets();
      updateTotals();
    };
  });
  // 라인 색상 직접 편집 (입력 중 색점만 갱신, 포커스 유지)
  document.querySelectorAll("[data-lcolor]").forEach(inp=>{
    inp.onmousedown=e=>e.stopPropagation();
    inp.oninput=()=>{
      const [bid,lid]=inp.dataset.lcolor.split("|");
      const b=state.baskets.find(x=>x.id===bid); if(!b) return;
      const l=b.lines.find(x=>x.lid===lid); if(!l) return;
      l.color=inp.value; saveBaskets();
      const dot=inp.parentElement.querySelector(".bl-dot");
      if(dot) dot.style.background=colorHex(inp.value);
    };
  });
  // 라인 사이즈 직접 편집
  document.querySelectorAll("[data-lsize]").forEach(inp=>{
    inp.onmousedown=e=>e.stopPropagation();
    inp.oninput=()=>{
      const [bid,lid]=inp.dataset.lsize.split("|");
      const b=state.baskets.find(x=>x.id===bid); if(!b) return;
      const l=b.lines.find(x=>x.lid===lid); if(!l) return;
      l.size=inp.value; saveBaskets();
    };
  });
  // 찜 항목: 색/사이즈 입력 저장(메모리)
  const colorMap={}, sizeMap={};
  document.querySelectorAll("[data-pc]").forEach(i=>i.oninput=()=>colorMap[i.dataset.pc]=i.value);
  document.querySelectorAll("[data-ps]").forEach(i=>i.oninput=()=>sizeMap[i.dataset.ps]=i.value);
  // 담기
  document.querySelectorAll("[data-padd]").forEach(btn=>btn.onclick=()=>{
    const id=btn.dataset.padd;
    const row=btn.closest(".pitem");
    const color=row.querySelector(".pi-color").value.trim();
    const size=row.querySelector(".pi-size").value.trim();
    const bid=row.querySelector(".pi-to").value;
    const b=state.baskets.find(x=>x.id===bid);
    if(b){ b.lines.push({lid:uid("l"), itemId:id, color, size, price:""}); saveBaskets();renderPicks(); }
  });
  // 찜 해제
  document.querySelectorAll("[data-premove]").forEach(btn=>btn.onclick=()=>{
    state.picks=state.picks.filter(x=>x!==btn.dataset.premove);
    savePicks();render();
  });

  // 드래그: 찜 항목 → 바구니 / 바구니 순서 변경
  let dragId=null, dragBasketId=null;
  document.querySelectorAll(".pitem").forEach(el=>{
    el.ondragstart=e=>{ dragId=el.dataset.pid; e.dataTransfer.effectAllowed="copy"; };
    el.ondragend=()=>{ dragId=null; };
  });
  document.querySelectorAll("[data-drop]").forEach(zone=>{
    zone.ondragover=e=>{ if(dragBasketId)return; e.preventDefault(); zone.classList.add("over"); };
    zone.ondragleave=()=>zone.classList.remove("over");
    zone.ondrop=e=>{
      if(dragBasketId) return;
      e.preventDefault(); zone.classList.remove("over");
      if(!dragId) return;
      const b=state.baskets.find(x=>x.id===zone.dataset.drop);
      const row=document.querySelector(`.pitem[data-pid="${dragId}"]`);
      const color=row?row.querySelector(".pi-color").value.trim():"";
      const size=row?row.querySelector(".pi-size").value.trim():"";
      if(b){ b.lines.push({lid:uid("l"), itemId:dragId, color, size, price:""}); saveBaskets();renderPicks(); }
    };
  });

  // 드래그: 바구니 순서 변경 (헤더를 잡고 다른 바구니 위로)
  document.querySelectorAll("[data-bdrag]").forEach(head=>{
    head.setAttribute("draggable","true");
    head.ondragstart=e=>{ dragBasketId=head.dataset.bdrag; e.dataTransfer.effectAllowed="move";
      head.closest(".basket").classList.add("bdragging"); };
    head.ondragend=()=>{ dragBasketId=null;
      document.querySelectorAll(".basket").forEach(x=>x.classList.remove("bdragging","btarget")); };
  });
  document.querySelectorAll(".basket").forEach(card=>{
    card.ondragover=e=>{ if(!dragBasketId||card.dataset.bid===dragBasketId)return;
      e.preventDefault(); card.classList.add("btarget"); };
    card.ondragleave=()=>card.classList.remove("btarget");
    card.ondrop=e=>{
      if(!dragBasketId||card.dataset.bid===dragBasketId)return;
      e.preventDefault();
      const from=state.baskets.findIndex(x=>x.id===dragBasketId);
      const to=state.baskets.findIndex(x=>x.id===card.dataset.bid);
      if(from<0||to<0)return;
      state.baskets.splice(to,0,state.baskets.splice(from,1)[0]);
      saveBaskets();renderPicks();
    };
  });
}

    "보라":"#7F77DD","퍼플":"#7F77DD","노랑":"#EFBF27","옐로우":"#EFBF27","노란":"#EFBF27",
    "주황":"#D85A30","오렌지":"#D85A30","올리브":"#7a7a3a","카키":"#b6a76a","크림":"#efe7d0",
    "민트":"#9fe1cb","버건디":"#5a1a2a","와인":"#5a1a2a","카모":"#5a6a3a","위장":"#5a6a3a",
    "실버":"#c4c4c4","은색":"#c4c4c4","골드":"#c9a227","금색":"#c9a227","남색":"#1b2a4a","청록":"#1D9E75"
  };
  for(const k in map){ if(n.includes(k)) return map[k]; }
  return "#888780";
}

/* ---------- Import / Export ---------- */
document.getElementById("btnExport").onclick=()=>{
  const blob=new Blob([JSON.stringify({picks:state.picks,notes:state.notes,baskets:state.baskets},null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="supreme26ss_picks.json";a.click();
};
document.getElementById("btnImport").onclick=()=>document.getElementById("fileImport").click();
document.getElementById("fileImport").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const o=JSON.parse(r.result);
    if(Array.isArray(o.picks)){state.picks=o.picks.filter(id=>byId[id]);savePicks();}
    if(o.notes && typeof o.notes==="object"){state.notes=o.notes;saveNotes();}
    if(Array.isArray(o.baskets)&&o.baskets.length){state.baskets=o.baskets;saveBaskets();}
    render();
  }catch(err){alert("파일을 읽을 수 없습니다.");}};
  r.readAsText(f);
};

/* ---------- Tabs ---------- */
document.getElementById("tabGallery").onclick=()=>switchTab("gallery");
document.getElementById("tabPicks").onclick=()=>switchTab("picks");
function switchTab(t){
  state.view=t;
  document.getElementById("tabGallery").classList.toggle("on",t==="gallery");
  document.getElementById("tabPicks").classList.toggle("on",t==="picks");
  document.getElementById("galleryView").hidden = (t!=="gallery");
  document.getElementById("picksView").hidden = (t!=="picks");
  if(t==="picks") renderPicks();
  else syncHeaderHeight();
  window.scrollTo(0,0);
}

/* ---------- Util ---------- */
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function syncHeaderHeight(){
  const h = document.querySelector("header");
  if(h) document.documentElement.style.setProperty("--hdr", (h.getBoundingClientRect().height)+"px");
}
window.addEventListener("resize", syncHeaderHeight);

function render(){
  buildFilters(); renderGallery(); syncHeaderHeight();
  updatePickBadge();
  if(state.view==="picks") renderPicks();
}

/* 갤러리 전체 재렌더 없이 찜 상태만 카드에 반영 */
function patchPickState(){
  const pset=new Set(state.picks);
  document.querySelectorAll(".card").forEach(card=>{
    const id=card.dataset.id;
    const picked=pset.has(id);
    card.classList.toggle("picked",picked);
    const btn=card.querySelector(".add");
    if(btn) btn.textContent=picked?"✓":"+";
  });
  updatePickBadge();
  if(state.view==="picks") renderPicks();
}

function updatePickBadge(){
  const picks=state.picks.map(id=>byId[id]).filter(Boolean);
  document.getElementById("tabCount").textContent = picks.length?`(${picks.length})`:"";
}

document.getElementById("logoSeason").textContent =
  (DATA.kreamTag ? DATA.kreamTag.replace(/(\d\d)(ss|fw)/,(m,y,s)=>y+(s==="ss"?"S/S":"F/W")) : "") + " Pick Board";

document.getElementById("metaLine").textContent =
  `${(DATA.seasonLabel||"")} · ${DATA.counts.unreleased+DATA.counts.released}개 · 미발매 ${DATA.counts.unreleased} / 발매 ${DATA.counts.released} · 최신 W${LATEST} · ${DATA.updated}`;

render();

// Service Worker 등록 (이미지 캐시)
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
