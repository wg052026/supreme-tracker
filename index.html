<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Supreme 26S/S Pick Board</title>
<style>
:root{
  --bg:#0b0b0c; --panel:#141416; --panel2:#1b1b1f; --line:#2a2a30;
  --txt:#f3f3f4; --mut:#8a8a93; --acc:#e51937; --acc2:#ff3b54;
  --ok:#33d17a; --chip:#222228; --kream:#161616; --kream-line:#333;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:"Helvetica Neue",Helvetica,Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased; font-size:14px;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}

/* ===== Header ===== */
header{
  position:sticky; top:0; z-index:50; background:rgba(11,11,12,.92);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
}
.bar{display:flex;align-items:center;gap:14px;padding:12px 18px;flex-wrap:wrap}
.logo{font-weight:800;font-style:italic;font-size:20px;letter-spacing:-.5px}
.logo b{background:var(--acc);color:#fff;padding:2px 8px;border-radius:3px;font-style:italic}
.meta-line{color:var(--mut);font-size:12px}
.spacer{flex:1}
.io-btns{display:flex;gap:8px}
.io-btns button{
  background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  padding:7px 12px;border-radius:8px;font-size:12px
}
.io-btns button:hover{border-color:var(--acc)}

/* ===== Filters ===== */
.filters{display:flex;gap:8px;padding:10px 18px;flex-wrap:wrap;border-bottom:1px solid var(--line);align-items:center}
.chip{
  background:var(--chip);border:1px solid var(--line);color:var(--txt);
  padding:6px 13px;border-radius:999px;font-size:12.5px;white-space:nowrap
}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.chip.week{border-color:var(--acc2)}
.chip.week.on{background:var(--acc2);border-color:var(--acc2)}
.toggle{
  display:inline-flex;align-items:center;gap:7px;margin-left:auto;
  color:var(--mut);font-size:12.5px;user-select:none
}
.toggle input{accent-color:var(--acc);width:15px;height:15px}
.sortsel{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:8px;padding:6px 10px;font-size:12px;margin-left:8px}
.sortsel:hover{border-color:var(--acc)}

/* ===== Layout ===== */
.wrap{display:flex;gap:0;align-items:flex-start}
.gallery{flex:1;min-width:0;padding:16px 18px 60px}
.aside{
  width:330px;flex:none;border-left:1px solid var(--line);
  position:sticky;top:108px;height:calc(100vh - 108px);overflow:auto;
  background:var(--panel);padding:16px 14px 40px
}

/* ===== Grid & Sections ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.wsec{margin-bottom:30px;scroll-margin-top:120px}
.wsec-head{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;
  padding-bottom:8px;border-bottom:1px solid var(--line)}
.wsec-head h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.3px}
.wsec-head span{color:var(--mut);font-size:12px}
.weekjump{display:flex;gap:6px;padding:9px 18px;flex-wrap:wrap;align-items:center;
  border-bottom:1px solid var(--line);background:var(--panel)}
.weekjump .jl{color:var(--mut);font-size:11.5px;margin-right:2px}
.wchip{background:var(--chip);border:1px solid var(--line);color:var(--mut);
  padding:4px 9px;border-radius:6px;font-size:11px;white-space:nowrap}
.wchip:hover{border-color:var(--acc);color:var(--txt)}
.wchip.latest{border-color:var(--acc);color:var(--txt);font-weight:700}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;display:flex;flex-direction:column;position:relative;
  transition:border-color .15s,transform .15s
}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
.card.picked{border-color:var(--ok)}
.thumb{aspect-ratio:1/1;background:#fff;position:relative;cursor:pointer;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;
  position:absolute;inset:0;opacity:0;transition:opacity .25s}
.thumb img.on{opacity:1}
.dots{position:absolute;bottom:7px;left:0;right:0;display:flex;justify-content:center;gap:4px;
  pointer-events:none;opacity:0;transition:opacity .2s;z-index:2}
.card:hover .dots{opacity:1}
.dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.45);
  box-shadow:0 0 2px rgba(0,0,0,.6)}
.dots i.on{background:#fff}
.price{font-size:12px;font-weight:700;color:var(--ok)}
.price.tba{color:var(--mut);font-weight:500}
.badge{
  position:absolute;top:7px;left:7px;font-size:10px;font-weight:800;
  padding:3px 7px;border-radius:5px;letter-spacing:.3px
}
.badge.coming{background:#000;color:#fff;border:1px solid #444}
.badge.wk{background:var(--acc2);color:#fff}
.badge.wk.hot{background:var(--acc)}
.add{
  position:absolute;bottom:7px;right:7px;width:30px;height:30px;border-radius:50%;
  background:rgba(0,0,0,.78);color:#fff;border:1px solid #555;font-size:19px;
  display:flex;align-items:center;justify-content:center;line-height:1
}
.add:hover{background:var(--acc);border-color:var(--acc)}
.card.picked .add{background:var(--ok);border-color:var(--ok);color:#000}
.cbody{padding:9px 10px 10px;display:flex;flex-direction:column;gap:7px;flex:1}
.cname{font-size:12.5px;line-height:1.35;font-weight:600;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.ccat{color:var(--mut);font-size:11px}
.kream-btn{
  margin-top:auto;display:block;text-align:center;background:var(--kream);
  border:1px solid var(--kream-line);color:#fff;border-radius:8px;
  padding:8px 6px;font-size:12px;font-weight:700;letter-spacing:.2px
}
.kream-btn:hover{border-color:#888;background:#1f1f1f}

/* ===== Aside / Picks ===== */
.aside h2{font-size:13px;margin:0 0 4px;letter-spacing:.4px;color:var(--mut);text-transform:uppercase}
.sec{margin-bottom:22px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.sec-head .sub{color:var(--mut);font-size:11.5px}
.empty{color:var(--mut);font-size:12px;padding:10px 2px;border:1px dashed var(--line);border-radius:8px;text-align:center}
.pick{
  display:flex;gap:9px;align-items:center;background:var(--panel2);
  border:1px solid var(--line);border-radius:9px;padding:7px;margin-bottom:7px;cursor:grab
}
.pick.drag{opacity:.4}
.pick img{width:42px;height:42px;object-fit:cover;border-radius:6px;background:#fff;flex:none}
.pick .pn{flex:1;min-width:0;font-size:12px;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pick .pchk{accent-color:var(--acc);width:15px;height:15px;flex:none}
.pick .ord{display:flex;flex-direction:column;gap:2px;flex:none}
.pick .ord button{width:22px;height:18px;background:var(--chip);border:1px solid var(--line);
  color:var(--txt);border-radius:4px;font-size:10px;line-height:1;padding:0}
.pick .del{background:none;border:none;color:var(--mut);font-size:18px;flex:none;padding:0 2px}
.pick .del:hover{color:var(--acc)}
.bulk{display:flex;gap:8px;margin-bottom:10px}
.bulk button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:8px;padding:7px;font-size:11.5px}
.bulk button:hover{border-color:var(--acc)}
.total{border-top:1px solid var(--line);padding-top:10px;margin-top:6px;
  display:flex;justify-content:space-between;font-size:13px}
.total b{color:var(--ok)}

/* ===== Mobile tabs ===== */
.tabs{display:none}
@media(max-width:820px){
  .aside{position:static;width:auto;height:auto;border-left:none;border-top:1px solid var(--line)}
  .wrap{flex-direction:column}
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;background:none;border:none;color:var(--mut);padding:12px;
    font-size:13px;font-weight:700;border-bottom:2px solid transparent}
  .tabs button.on{color:var(--txt);border-bottom-color:var(--acc)}
  .gallery,.aside{display:none}
  .gallery.show,.aside.show{display:block}
  .cards{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:11px}
  .weekjump{padding:8px 12px}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo"><b>Supreme</b> <span id="logoSeason">Pick Board</span></div>
    <div class="meta-line" id="metaLine"></div>
    <div class="spacer"></div>
    <div class="io-btns">
      <button id="btnExport">내보내기</button>
      <button id="btnImport">가져오기</button>
      <input type="file" id="fileImport" accept="application/json" hidden>
    </div>
  </div>
  <div class="filters" id="filters"></div>
  <div class="weekjump" id="weekJump" style="display:none"></div>
</header>

<div class="tabs">
  <button id="tabGallery" class="on">갤러리</button>
  <button id="tabPicks">내 픽 <span id="tabCount"></span></button>
</div>

<div class="wrap">
  <main class="gallery show" id="gallery"><div id="grid"></div></main>
  <aside class="aside" id="aside">
    <div class="bulk">
      <button id="selAll">전체선택</button>
      <button id="selNone">선택해제</button>
      <button id="delSel">선택삭제</button>
    </div>
    <div class="sec" id="secWeek"></div>
    <div class="sec" id="secAll"></div>
    <div class="total"><span>전체 픽 합계</span><b id="grandTotal">0개</b></div>
  </aside>
</div>

<script type="module">
const DATA = await (async()=>{ const r=await fetch("data/data.json",{cache:"no-store"}); if(!r.ok) throw new Error("data load failed"); return await r.json(); })();

/* ---------- KREAM 검색어: Supreme 접두어 + 시즌 태그(26ss/26fw 자동) 둘 다 유지 ---------- */
function kreamUrl(name){
  let s=(name||"").replace(/[®™]/g,"").replace(/\s*\/\s*/g," ");
  s=s.replace(/\bZip Up\b/ig,"").replace(/\bS S\b/g,"").replace(/\bL S\b/g,"");
  s=s.replace(/\s+/g," ").trim();
  if(!/^supreme\b/i.test(s)) s="Supreme "+s;
  s=s+" "+(DATA.kreamTag||"26ss");
  return "https://kream.co.kr/search?tab=products&keyword="+encodeURIComponent(s);
}

const LATEST = DATA.latestWeek;
const STORE_KEY = "supreme26ss_picks_v1";

let state = {
  cat: "ALL",
  unreleasedOnly: false,
  picks: loadPicks(),     // array of item ids, in order
  selected: new Set(),    // ids checked for bulk delete
};

function loadPicks(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch(e){ return []; }
}
function savePicks(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state.picks)); }catch(e){}
}

const byId = {};
DATA.items.forEach(it=>byId[it.id]=it);

/* ---------- Filters ---------- */
function buildFilters(){
  const f = document.getElementById("filters");
  const cats = ["ALL", ...DATA.cats];
  let html = "";
  cats.forEach(c=>{
    html += `<button class="chip ${state.cat===c?'on':''}" data-cat="${c}">${c==='ALL'?'전체':c}</button>`;
  });
  html += `<label class="toggle"><input type="checkbox" id="relToggle" ${state.unreleasedOnly?'checked':''}> 미발매만 보기</label>`;
  f.innerHTML = html;

  f.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;render();});
  document.getElementById("relToggle").onchange=e=>{state.unreleasedOnly=e.target.checked;render();};

  // 주차 바로가기 칩 (전체 보기일 때만)
  const jump = document.getElementById("weekJump");
  if(!state.unreleasedOnly){
    const weeks = [...new Set(DATA.items.filter(x=>x.released).map(x=>x.week))].sort((a,b)=>b-a);
    jump.style.display = "flex";
    jump.innerHTML = `<span class="jl">바로가기:</span>`
      + `<button class="wchip" data-jump="unreleased">미발매 ${DATA.counts.unreleased}</button>`
      + weeks.map(w=>{
          const n = DATA.items.filter(x=>x.released&&x.week===w).length;
          return `<button class="wchip ${w===LATEST?'latest':''}" data-jump="w${w}">W${w} ${n}</button>`;
        }).join("");
    jump.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{
      const el=document.getElementById("sec-"+b.dataset.jump);
      if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
    });
  }else{
    jump.style.display = "none";
    jump.innerHTML = "";
  }
}

/* ---------- Gallery ---------- */
function priceNum(p){ const m=(p||"").match(/\d+/); return m?parseInt(m[0],10):null; }

function filteredItems(){
  let list = DATA.items.slice();
  if(state.cat!=="ALL") list = list.filter(x=>x.cat===state.cat);
  if(state.unreleasedOnly) list = list.filter(x=>!x.released);
  return list;
}

function cardHtml(it, pset){
  const picked = pset.has(it.id);
  const badge = it.released
    ? `<span class="badge wk ${it.week===LATEST?'hot':''}">W${it.week}</span>`
    : `<span class="badge coming">예정</span>`;
  const imgs = (it.imgs && it.imgs.length ? it.imgs : [it.img]).slice(0,6);
  const imgTags = imgs.map((u,idx)=>`<img class="${idx===0?'on':''}" loading="lazy" src="${u}" alt="${esc(it.name)}">`).join("");
  const dots = imgs.length>1 ? `<div class="dots">${imgs.map((_,idx)=>`<i class="${idx===0?'on':''}"></i>`).join("")}</div>` : "";
  const priceHtml = it.price ? `<span class="price">${it.price}</span>` : `<span class="price tba">가격 미정</span>`;
  return `<div class="card ${picked?'picked':''}" data-id="${it.id}">
      <div class="thumb" data-url="${it.url}" data-imgs="${imgs.length}">
        ${badge}${imgTags}${dots}
        <button class="add" data-add="${it.id}" title="픽 추가/제거">${picked?'✓':'+'}</button>
      </div>
      <div class="cbody">
        <div class="cname">${esc(it.name)}</div>
        <div class="ccat">${it.cat} · ${priceHtml}</div>
        <a class="kream-btn" href="${kreamUrl(it.name)}" target="_blank" rel="noopener">KREAM 검색</a>
      </div>
    </div>`;
}

function renderGallery(){
  const grid = document.getElementById("grid");
  const list = filteredItems();
  const pset = new Set(state.picks);

  if(!list.length){ grid.innerHTML = `<div class="empty">조건에 맞는 아이템이 없습니다.</div>`; bindGalleryEvents(); return; }

  let html = "";
  if(state.unreleasedOnly){
    // 미발매만: 단일 섹션
    html = secBlock("unreleased", `Left To Drop · 미발매`, list.length, list, pset);
  }else{
    // 전체: 섹션 분할 (미발매 → 주차 내림차순)
    const un = list.filter(x=>!x.released);
    if(un.length){
      html += secBlock("unreleased", `Left To Drop · 미발매`, un.length, un, pset);
    }
    const weeks = [...new Set(list.filter(x=>x.released).map(x=>x.week))].sort((a,b)=>b-a);
    weeks.forEach(w=>{
      const wi = list.filter(x=>x.released && x.week===w);
      const label = `Week ${w}` + (w===LATEST?` · 최신`:``);
      html += secBlock("w"+w, label, wi.length, wi, pset);
    });
  }
  grid.innerHTML = html;
  bindGalleryEvents();
}

function secBlock(id, title, count, items, pset){
  return `<section class="wsec" id="sec-${id}">
    <div class="wsec-head"><h3>${title}</h3><span>${count}개</span></div>
    <div class="cards">${items.map(it=>cardHtml(it,pset)).join("")}</div>
  </section>`;
}

function bindGalleryEvents(){
  const grid = document.getElementById("grid");
  grid.querySelectorAll(".thumb").forEach(t=>{
    t.onclick=e=>{ if(e.target.closest(".add"))return; window.open(t.dataset.url,"_blank"); };
    const imgs=[...t.querySelectorAll("img")];
    const dots=[...t.querySelectorAll(".dots i")];
    if(imgs.length>1){
      let idx=0, timer=null;
      const show=i=>{
        imgs[idx].classList.remove("on"); if(dots[idx])dots[idx].classList.remove("on");
        idx=(i+imgs.length)%imgs.length;
        imgs[idx].classList.add("on"); if(dots[idx])dots[idx].classList.add("on");
      };
      const card=t.closest(".card");
      card.addEventListener("mouseenter",()=>{ timer=setInterval(()=>show(idx+1),650); });
      card.addEventListener("mouseleave",()=>{ clearInterval(timer); show(0); });
      t.addEventListener("mousemove",e=>{
        const r=t.getBoundingClientRect();
        const seg=Math.floor((e.clientX-r.left)/(r.width/imgs.length));
        if(seg!==idx && seg>=0 && seg<imgs.length){ clearInterval(timer); show(seg); }
      });
    }
  });
  grid.querySelectorAll("[data-add]").forEach(b=>b.onclick=e=>{e.stopPropagation();togglePick(b.dataset.add);});
}

function togglePick(id){
  const i = state.picks.indexOf(id);
  if(i>=0) state.picks.splice(i,1);
  else state.picks.push(id);
  savePicks(); render();
}

/* ---------- Picks panel ---------- */
function renderPicks(){
  const items = state.picks.map(id=>byId[id]).filter(Boolean);

  document.getElementById("secWeek").innerHTML = "";
  document.getElementById("secAll").innerHTML  = sectionHtml(`내 픽`, items, true);

  const total = items.reduce((s,x)=>s+(priceNum(x.price)||0),0);
  document.getElementById("grandTotal").textContent =
    items.length+"개" + (total?` · ~$${total}`:"");
  document.getElementById("tabCount").textContent = items.length?`(${items.length})`:"";

  bindPickEvents();
}

function sectionHtml(title, list, showOrder){
  let body;
  if(!list.length){ body = `<div class="empty">아직 없음</div>`; }
  else{
    body = list.map(it=>{
      const checked = state.selected.has(it.id)?'checked':'';
      const ord = showOrder ? `<div class="ord">
          <button data-up="${it.id}">▲</button>
          <button data-down="${it.id}">▼</button></div>` : "";
      return `<div class="pick" draggable="${showOrder?'true':'false'}" data-pid="${it.id}">
        <input type="checkbox" class="pchk" data-chk="${it.id}" ${checked}>
        <img src="${it.img}" alt="">
        <div class="pn">${esc(it.name)}</div>
        ${ord}
        <button class="del" data-del="${it.id}">×</button>
      </div>`;
    }).join("");
  }
  return `<div class="sec-head"><h2>${title}</h2><span class="sub">${list.length}개</span></div>${body}`;
}

function bindPickEvents(){
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    state.picks=state.picks.filter(x=>x!==b.dataset.del);
    state.selected.delete(b.dataset.del);
    savePicks();render();
  });
  document.querySelectorAll("[data-chk]").forEach(c=>c.onchange=()=>{
    if(c.checked) state.selected.add(c.dataset.chk); else state.selected.delete(c.dataset.chk);
  });
  document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>moveP(b.dataset.up,-1));
  document.querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>moveP(b.dataset.down,1));

  // drag reorder (전체 픽 섹션)
  let dragId=null;
  document.querySelectorAll('.pick[draggable="true"]').forEach(el=>{
    el.ondragstart=()=>{dragId=el.dataset.pid;el.classList.add("drag");};
    el.ondragend=()=>{el.classList.remove("drag");dragId=null;};
    el.ondragover=e=>e.preventDefault();
    el.ondrop=e=>{e.preventDefault();
      const tgt=el.dataset.pid;
      if(!dragId||dragId===tgt)return;
      const arr=state.picks;
      const from=arr.indexOf(dragId), to=arr.indexOf(tgt);
      arr.splice(to,0,arr.splice(from,1)[0]);
      savePicks();render();
    };
  });
}

function moveP(id,dir){
  const arr=state.picks, i=arr.indexOf(id), j=i+dir;
  if(j<0||j>=arr.length)return;
  [arr[i],arr[j]]=[arr[j],arr[i]];
  savePicks();render();
}

/* ---------- Bulk ---------- */
document.getElementById("selAll").onclick=()=>{state.picks.forEach(id=>state.selected.add(id));render();};
document.getElementById("selNone").onclick=()=>{state.selected.clear();render();};
document.getElementById("delSel").onclick=()=>{
  if(!state.selected.size)return;
  state.picks=state.picks.filter(id=>!state.selected.has(id));
  state.selected.clear();savePicks();render();
};

/* ---------- Import / Export ---------- */
document.getElementById("btnExport").onclick=()=>{
  const blob=new Blob([JSON.stringify({picks:state.picks},null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="supreme26ss_picks.json";a.click();
};
document.getElementById("btnImport").onclick=()=>document.getElementById("fileImport").click();
document.getElementById("fileImport").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const o=JSON.parse(r.result);
    if(Array.isArray(o.picks)){state.picks=o.picks.filter(id=>byId[id]);savePicks();render();}
  }catch(err){alert("파일을 읽을 수 없습니다.");}};
  r.readAsText(f);
};

/* ---------- Mobile tabs ---------- */
document.getElementById("tabGallery").onclick=()=>switchTab("gallery");
document.getElementById("tabPicks").onclick=()=>switchTab("picks");
function switchTab(t){
  document.getElementById("tabGallery").classList.toggle("on",t==="gallery");
  document.getElementById("tabPicks").classList.toggle("on",t==="picks");
  document.getElementById("gallery").classList.toggle("show",t==="gallery");
  document.getElementById("aside").classList.toggle("show",t==="picks");
}

/* ---------- Util ---------- */
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(){ buildFilters(); renderGallery(); renderPicks(); }

document.getElementById("logoSeason").textContent =
  (DATA.kreamTag ? DATA.kreamTag.replace(/(\d\d)(ss|fw)/,(m,y,s)=>y+(s==="ss"?"S/S":"F/W")) : "") + " Pick Board";

document.getElementById("metaLine").textContent =
  `${(DATA.seasonLabel||"")} · ${DATA.counts.unreleased+DATA.counts.released}개 · 미발매 ${DATA.counts.unreleased} / 발매 ${DATA.counts.released} · 최신 W${LATEST} · ${DATA.updated}`;

render();
</script>
</body>
